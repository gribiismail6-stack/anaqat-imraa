
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أناقة إمرأة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#fff5f8;
color:#222;
}

header{
background:#fff;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:34px;
font-weight:800;
color:#e91e63;
}

.logo span{
display:block;
font-size:14px;
font-weight:500;
color:#777;
}

nav a{
text-decoration:none;
color:#333;
margin:0 12px;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#e91e63;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
padding:25px 0;
}

.hero{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

.gallery{
display:flex;
gap:15px;
}

.thumbs{
display:flex;
flex-direction:column;
gap:12px;
}

.thumbs img{
width:90px;
height:110px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
border:2px solid transparent;
transition:.3s;
}

.thumbs img:hover{
border-color:#e91e63;
}

.main-image img{
width:100%;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.info h1{
font-size:50px;
margin-bottom:10px;
}

.price{
font-size:38px;
font-weight:bold;
color:#e91e63;
margin:20px 0;
}

.old{
text-decoration:line-through;
color:#888;
font-size:25px;
margin-right:15px;
}

.buy-btn{
display:block;
width:100%;
background:#e91e63;
color:#fff;
padding:18px;
border:none;
border-radius:14px;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.buy-btn:hover{
background:#c2185b;
}

</style>

</head>

<body>

<header>

<div class="logo">
أناقة إمرأة
<span>لأنك تستحقين الأناقة</span>
</div>

<nav>
<a href="#">الرئيسية</a>
<a href="#">المنتجات</a>
<a href="#">من نحن</a>
<a href="#">اتصل بنا</a>
</nav>

</header>
<!-- القسم الرئيسي -->
<section class="hero">
    <h1>أناقة إمرأة</h1>
    <p>اكتشفي أجمل الأزياء النسائية بتصاميم عصرية</p>
    <button onclick="document.getElementById('order').scrollIntoView()">
        اطلبي الآن
    </button>
</section>


<!-- المنتجات -->
<section class="products">

<h2>منتجاتنا</h2>

<div class="product-card">

<h3>بيجامة نسائية</h3>

<p>أناقة وراحة بتصميم مميز</p>

<p class="price">2500 دج</p>

<button onclick="buy('بيجامة نسائية')">
اطلبي الآن
</button>

</div>

</section>


<!-- استمارة الطلب -->
<section id="order" class="order-box">

<h2>تأكيد الطلب</h2>

<form id="orderForm">

<input type="text" id="name" placeholder="الإسم الكامل" required>

<input type="tel" id="phone" placeholder="رقم الهاتف" required>


<select id="wilaya" required>
<option value="">اختر الولاية</option>
<option>الشلف</option>
<option>الجزائر</option>
<option>وهران</option>
<option>قسنطينة</option>
<option>سطيف</option>
</select>


<input type="text" id="address" placeholder="العنوان كامل" required>


<input type="number" id="quantity" value="1" min="1">


<input type="hidden" id="product">


<button type="submit">
إرسال الطلب
</button>


</form>

<div id="successMessage" style="
display:none;
text-align:center;
margin-top:20px;
padding:20px;
background:#e8ffe8;
color:green;
font-size:20px;
border-radius:15px;">
</div>

</section>


<script>

function buy(productName){

document.getElementById("product").value = productName;

document.getElementById("order").scrollIntoView();

}


document.getElementById("orderForm").addEventListener("submit", function(e){

e.preventDefault();


let data = {

name: document.getElementById("name").value,

phone: document.getElementById("phone").value,

wilaya: document.getElementById("wilaya").value,

address: document.getElementById("address").value,

quantity: document.getElementById("quantity").value

};


fetch("https://script.google.com/macros/s/AKfycbw4NNsXr8V4mjd-RzQVGpJJGgbukYESFjtmYGoOZ3rPd0m4eWrfK8jZZDdC9ZStfXHq/exec", {

method:"POST",

body: JSON.stringify(data)

})


.then(() => {

document.getElementById("successMessage").style.display="block";

document.getElementById("successMessage").innerHTML =
"✅ تم إرسال طلبك بنجاح";

document.getElementById("orderForm").reset();

});


});

</script>


</body>
</html>
