
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أناقة إمرأة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#fff5f8;
color:#222;
}

header{
background:#fff;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:34px;
font-weight:800;
color:#e91e63;
}

.logo span{
display:block;
font-size:14px;
font-weight:500;
color:#777;
}

nav a{
text-decoration:none;
color:#333;
margin:0 12px;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#e91e63;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
padding:25px 0;
}

.hero{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

.gallery{
display:flex;
gap:15px;
}

.thumbs{
display:flex;
flex-direction:column;
gap:12px;
}

.thumbs img{
width:90px;
height:110px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
border:2px solid transparent;
transition:.3s;
}

.thumbs img:hover{
border-color:#e91e63;
}

.main-image img{
width:100%;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.info h1{
font-size:50px;
margin-bottom:10px;
}

.price{
font-size:38px;
font-weight:bold;
color:#e91e63;
margin:20px 0;
}

.old{
text-decoration:line-through;
color:#888;
font-size:25px;
margin-right:15px;
}

.buy-btn{
display:block;
width:100%;
background:#e91e63;
color:#fff;
padding:18px;
border:none;
border-radius:14px;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.buy-btn:hover{
background:#c2185b;
}

</style>

</head>

<body>

<header>

<div class="logo">
أناقة إمرأة
<span>لأنك تستحقين الأناقة</span>
</div>

<nav>
<a href="#">الرئيسية</a>
<a href="#">المنتجات</a>
<a href="#">من نحن</a>
<a href="#">اتصل بنا</a>
</nav>

</header>
