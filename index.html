
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أناقة إمرأة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
أناقة إمرأة
<span>لأنك تستحقين الأناقة</span>
</div>

<nav>
<a href="#home">الرئيسية</a>
<a href="#products">المنتجات</a>
<a href="#about">من نحن</a>
<a href="#contact">اتصل بنا</a>
</nav>

</header>
<section id="home" class="hero">
    <h1>أناقة إمرأة</h1>
    <p>اكتشفي أجمل الأزياء النسائية بتصاميم عصرية</p>
    <button onclick="document.getElementById('order').scrollIntoView()">
        اطلبي الآن
    </button>
</section>



<section id="products" class="products">

<h2>منتجاتنا</h2>

<div class="product-card">

<h3>بيجامة نسائية</h3>

<p>أناقة وراحة بتصميم مميز</p>

<p class="price">2500 دج</p>

<button onclick="buy('بيجامة نسائية')">
اطلبي الآن
</button>

</div>

</section>



<section id="order" class="order-box">

<h2>تأكيد الطلب</h2>

<form id="orderForm">

<input type="text" id="name" placeholder="الإسم الكامل" required>

<input type="tel" id="phone" placeholder="رقم الهاتف" required>


<select id="wilaya" required>
<option value="">اختر الولاية</option>
<option>الشلف</option>
<option>الجزائر</option>
<option>وهران</option>
<option>قسنطينة</option>
<option>سطيف</option>
</select>


<input type="text" id="address" placeholder="العنوان كامل" required>


<input type="number" id="quantity" value="1" min="1">


<input type="hidden" id="product">


<button type="submit">
إرسال الطلب
</button>


</form>

<div id="successMessage" style="
display:none;
text-align:center;
margin-top:20px;
padding:20px;
background:#e8ffe8;
color:green;
font-size:20px;
border-radius:15px;">
✅ تم إرسال طلبك بنجاح<br>
سنتصل بك قريبًا لتأكيد الطلب.
</div>

</section>

<script>

function buy(productName){
    document.getElementById("product").value = productName;
    document.getElementById("order").scrollIntoView();
}

document.getElementById("orderForm").addEventListener("submit", function(e){

    e.preventDefault();

    let data = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        wilaya: document.getElementById("wilaya").value,
        address: document.getElementById("address").value,
        quantity: document.getElementById("quantity").value
    };

    fetch("https://script.google.com/macros/s/AKfycbw4NNsXr8V4mjd-RzQVGpJJGgbukYESFjtmYGoOZ3rPd0m4eWrfK8jZZDdC9ZStfXHq/exec", {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(data)
    })
    .then(() => {

        let msg = document.getElementById("successMessage");
        msg.innerHTML = "✅ تم إرسال طلبك بنجاح<br>سنتصل بك قريبًا.";
        msg.style.display = "block";

        document.getElementById("orderForm").reset();

        setTimeout(() => {
            msg.style.display = "none";
        }, 3000);

    })
    .catch(() => {
        alert("حدث خطأ أثناء إرسال الطلب.");
    });

});

</script>


</body>
</html>
